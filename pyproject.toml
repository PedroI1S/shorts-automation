[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv", "venv", "storage", "deployment"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PLW1510"]

[tool.ruff.lint.isort]
known-first-party = ["config", "legacy", "shorts_automation", "tests"]

[tool.ruff.format]
line-ending = "lf"
